# Verdix v0.1
#
# Quick start:
#   1. Copy example.env to .env and fill in your values.
#      VX_ADMIN_PASSWORD, VX_SURICATA_LOG_DIR, and VX_SURICATA_CONFIG_DIR are required.
#   2. Run:  docker compose up -d
#      First run pulls ~22 GB total: ~11 GB of images (the llm image bundles
#      Ollama's CUDA/ROCm runtime, ~10.6 GB of that alone) plus an ~11 GB
#      model pull into the verdix_models volume. Images and the model land
#      on different filesystems if Docker storage is relocated — see
#      DEPLOYMENT.md's storage requirements. Subsequent starts are instant.
#
# To stop (keeps all data):  docker compose down
# To fully uninstall:        docker compose down -v

services:

  app:
    # Pinned to the v0.1.5 release build — the shipped compose file never
    # tracks :latest, so an install today and an install next month pull the
    # same bytes. CI moves :latest on every successful build; use that for
    # local dev only, never here.
    image: ghcr.io/verdixsec/verdix/app:0.1.5
    restart: unless-stopped
    depends_on:
      llm:
        condition: service_healthy
    volumes:
      - verdix_data:/var/lib/verdix

      # ── Suricata bind mounts (read-only) ──────────────────────────────────────
      # Set VX_SURICATA_LOG_DIR and VX_SURICATA_CONFIG_DIR in your .env file.
      # NFS/SMB mounts work here — mount the remote share on this host first,
      # then point these variables at your mount point.
      - ${VX_SURICATA_LOG_DIR:-/var/log/suricata}:/host/suricata/logs:ro
      - ${VX_SURICATA_CONFIG_DIR:-/etc/suricata}:/host/suricata/config:ro

      # Optional: custom CA bundle for TLS-inspecting proxies.
      # - /path/to/your/ca-bundle.pem:/host/certs/ca-bundle.pem:ro

    environment:
      # ── Required ──────────────────────────────────────────────────────────────
      VX_ADMIN_PASSWORD: "${VX_ADMIN_PASSWORD}"

      # ── Paths (match the volume mounts above) ─────────────────────────────────
      VX_EVE_LOG_PATH: /host/suricata/logs/eve.json
      VX_SURICATA_CONFIG_PATH: /host/suricata/config/suricata.yaml
      VX_DB_PATH: /var/lib/verdix/verdix.db

      # ── GeoIP (DB-IP Community Edition, baked into the app image) ─────────────
      VX_GEOIP_COUNTRY_DB_PATH: /var/lib/verdix/geoip/dbip-country-lite.mmdb
      VX_GEOIP_ASN_DB_PATH: /var/lib/verdix/geoip/dbip-asn-lite.mmdb

      # ── Enrichment (optional but strongly recommended) ────────────────────────
      VX_VIRUSTOTAL_API_KEY: "${VX_VIRUSTOTAL_API_KEY:-}"

      # ── Reverse DNS (optional — set to your internal DNS for hostname resolution)
      VX_DNS_SERVER: "${VX_DNS_SERVER:-}"

      # ── LLM (points to the sibling llm container — no changes needed) ─────────
      VX_OLLAMA_URL: http://llm:11434/api/chat
      VX_OLLAMA_MODEL: gemma4:e4b-it-q8_0
      VX_OLLAMA_TIMEOUT_SECONDS: "600"

      # ── Feedback (optional — leave blank to keep feedback local-only) ─────────
      VX_FEEDBACK_ENDPOINT: "${VX_FEEDBACK_ENDPOINT:-}"
      VX_FEEDBACK_TOKEN: "${VX_FEEDBACK_TOKEN:-}"

      # ── Triage tuning (defaults work for most environments) ───────────────────
      VX_FLOW_CONTEXT_DELAY_SECONDS: "30"
      VX_TRIAGE_DAILY_CAP: "300"
      VX_DAILY_RESET_HOUR: "0"
      VX_EVE_CONTEXT_RETENTION_DAYS: "7"

      # ── Proxy (uncomment if your network uses a forward proxy) ────────────────
      # HTTP_PROXY: "http://proxy.example.com:8080"
      # HTTPS_PROXY: "http://proxy.example.com:8080"
      # NO_PROXY: "localhost,llm,127.0.0.1"

    ports:
      - "8080:8080"
    healthcheck:
      # No curl in this image (python:3.13-slim + libgomp1 + gosu only —
      # see Dockerfile) and the Dockerfile's own CMD already runs `python`,
      # so this uses stdlib urllib rather than adding a package for one
      # check. /health is green (200) while the ingestion pipeline is
      # green, 503 when it's red or blocked (ADR-019). llm's own
      # start_period (2400s, for its first-run model pull) does not delay
      # this — app only waits on llm via depends_on's service_healthy
      # condition, not on llm's start_period; 60s here covers app's own boot.
      test: ["CMD", "python", "-c", "import sys, urllib.request as u\ntry:\n    sys.exit(0 if u.urlopen('http://localhost:8080/health', timeout=3).status == 200 else 1)\nexcept Exception:\n    sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal

  llm:
    # Lean image — Ollama runtime only, no model baked in (~10.6 GB itself:
    # the upstream ollama/ollama base image bundles CUDA and ROCm runtime
    # libraries, and our lean layer on top is a 26 MB delta). This ~10.6 GB
    # lands in Docker's image/layer store, a different location from the
    # model below. On first run the entrypoint natively `ollama pull`s
    # gemma4:e4b-it-q8_0 from ghcr.io/verdixsec/gemma4:e4b-it-q8_0
    # (Ollama-native OCI artifact, ~11 GB) straight into the verdix_models
    # volume, then aliases it to the local tag via `ollama cp` (manifest-only,
    # no byte copy). Peak disk during first run == model size, one copy.
    # Subsequent starts load from the volume in seconds — no network fetch.
    # For air-gapped installs see Dockerfile.fat + docker-compose.fat.yml.
    #
    # Pinned to the v0.1.5 release build (same reasoning as the app image
    # above). This also fixes a real gap: :latest previously pointed at an
    # image built 2026-06-18, two days before the lean re-architecture even
    # started, and as of this pin that tag no longer resolves at all (the
    # version behind it was removed from ghcr). The image validated in the
    # 2026-06-21 field test lives under a different tag entirely (lean-rc1).
    # Never let this drift back to a floating tag.
    image: ghcr.io/verdixsec/verdix/llm:0.1.5
    restart: unless-stopped
    volumes:
      - verdix_models:/root/.ollama
    healthcheck:
      # Greps for the specific model tag, not just "is ollama serve up" —
      # `ollama list` returns exit 0 with zero models loaded, which would
      # otherwise report Healthy while the first-run GGUF pull/import is
      # still in progress. start_period is generous to cover first-run oras
      # pull + ollama create (can take 20-40 min on slow links). Steady-state
      # restarts are healthy within ~30 s (model already in volume).
      test: ["CMD-SHELL", "ollama list 2>/dev/null | grep -q 'gemma4:e4b-it-q8_0'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 2400s
    # No ports exposed — the app container reaches Ollama via the internal network.
    # Uncomment to expose Ollama for debugging or the eval harness:
    # ports:
    #   - "11434:11434"
    networks:
      - internal
    # GPU acceleration — Ollama uses it transparently when present.
    # Uncomment if your host has an NVIDIA GPU with nvidia-container-toolkit installed:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  verdix_data:
    # All persistent state: SQLite database, GeoIP files, enrichment cache.
    # Survives container restarts and image updates.
  verdix_models:
    # Ollama model weights — populated by the lean image entrypoint on first run
    # (native `ollama pull` from ghcr, ~11 GB, single copy), then persisted here
    # so subsequent starts skip the fetch entirely and load the model from disk
    # in seconds.

networks:
  internal:
    driver: bridge
