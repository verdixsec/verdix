name: Secret scan

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 so gitleaks scans the entire commit history, not just HEAD.
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 now requires a paid license for org
      # accounts (verdixsec is one) and has failed on every run since this
      # workflow was created, 2026-06-18 -- silently, since a failed CI job
      # doesn't block anything by default. The gitleaks CLI itself is free
      # OSS; only the marketplace Action wrapper enforces the license. Pinned
      # to v8.21.2 to match .pre-commit-config.yaml's local hook, so both
      # layers scan with the same tool version.
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v
