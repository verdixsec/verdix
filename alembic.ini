[alembic]
# Path to migration scripts
script_location = alembic

# SQLAlchemy URL — overridden at runtime by env.py reading VX_DB_URL
# This default is used when running `alembic` CLI directly in development
sqlalchemy.url = sqlite+aiosqlite:///verdix.db

# Migration file naming convention: YYYYMMDD_HHMMSS_short_description.py
file_template = %%(year)s%%(month)s%%(day)s_%%(hour)s%%(minute)s%%(second)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
