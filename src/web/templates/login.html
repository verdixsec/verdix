<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verdix -- Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="/static/verdix-favicon.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0a0d12; color: #e4e7ec; font-family: 'Inter Tight', sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .card { width: 100%; max-width: 400px; background: #0f1318; border: 1px solid #1a2030; border-radius: 10px; padding: 32px 32px 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .card-header { display: flex; align-items: center; gap: 10px; padding-bottom: 22px; border-bottom: 1px solid #1a2030; margin-bottom: 24px; }
  .wordmark { display: flex; align-items: center; gap: 9px; }
  .wordmark-mark { width: 22px; height: 22px; flex-shrink: 0; }
  .wordmark-text { font-family: 'Space Grotesk', 'Inter Tight', system-ui, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -0.6px; color: #e4e7ec; line-height: 1; }
  .ea-badge { font-size: 10px; font-weight: 500; color: #3C3489; background: #EEEDFE; border: 1px solid #CECBF6; padding: 3px 8px; border-radius: 8px; }
  .title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: #f5f7fa; margin-bottom: 22px; }
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12px; font-weight: 500; color: #8b95a7; margin-bottom: 7px; }
  .input-wrap { position: relative; }
  .input { width: 100%; background: #080b10; border: 1px solid #1f2738; border-radius: 6px; padding: 11px 40px 11px 13px; color: #e4e7ec; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; transition: border-color 0.15s, background 0.15s; outline: none; }
  .input::placeholder { color: #4a5468; font-family: 'Inter Tight', sans-serif; }
  .input:focus { border-color: #3b82f6; background: #0a0f16; box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
  .input.error { border-color: rgba(255,78,91,0.50); }
  .input.error:focus { box-shadow: 0 0 0 3px rgba(255,78,91,0.12); }
  .eye-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 4px; background: transparent; border: none; color: #6b7587; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color 0.15s, background 0.15s; }
  .eye-btn:hover { color: #b8c1d0; background: rgba(255,255,255,0.04); }
  .btn-submit { width: 100%; background: #3b82f6; color: #fff; font-family: 'Inter Tight', sans-serif; font-size: 13.5px; font-weight: 500; padding: 11px 16px; border-radius: 6px; border: none; cursor: pointer; transition: background 0.15s; box-shadow: 0 1px 0 rgba(255,255,255,0.10) inset; margin-top: 4px; }
  .btn-submit:hover { background: #4f8ff7; }
  .btn-submit:disabled { background: #1f2738; color: #4a5468; cursor: not-allowed; box-shadow: none; }
  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 6px; font-size: 12.5px; display: flex; align-items: center; gap: 8px; line-height: 1.4; }
  .msg-error { background: rgba(255,78,91,0.08); border: 1px solid rgba(255,78,91,0.25); color: #ff8a92; }
  .msg-lockout { background: rgba(245,166,36,0.08); border: 1px solid rgba(245,166,36,0.25); color: #f5b54d; }
  .msg svg { flex-shrink: 0; }
  .countdown { margin-left: auto; font-family: 'JetBrains Mono', monospace; background: rgba(245,166,36,0.12); padding: 2px 7px; border-radius: 3px; font-size: 11.5px; color: #f5a624; font-weight: 500; }
  .help-text { margin-top: 16px; font-size: 11.5px; color: #6b7587; text-align: center; line-height: 1.5; }
  .help-text .mono { color: #8b95a7; background: rgba(255,255,255,0.03); padding: 1px 5px; border-radius: 3px; font-size: 11px; }
  .footer { border-top: 1px solid #1a2030; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #6b7587; background: #0a0d12; }
  .footer-left { display: flex; align-items: center; gap: 10px; }
  .health-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c984; box-shadow: 0 0 8px rgba(34,201,132,0.5); }
  .footer-right { color: #4a5468; }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="card-header">
      <div class="wordmark">
        <svg class="wordmark-mark" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <path d="M22 52 L42 74 L80 26" stroke="#7F77DD" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="wordmark-text">verdix</span>
      </div>
      <span class="ea-badge">Early Access</span>
    </div>
    <h1 class="title">Sign In</h1>
    <form method="post" action="/login">
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" class="input{% if error == 'incorrect_password' %} error{% endif %}"
                 placeholder="Enter your admin password" autocomplete="current-password"
                 {% if locked %}disabled{% endif %}>
          <button type="button" class="eye-btn" onclick="togglePassword()" aria-label="Show password">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M1 8C1 8 3.5 3 8 3C12.5 3 15 8 15 8C15 8 12.5 13 8 13C3.5 13 1 8 1 8Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-submit" {% if locked %}disabled{% endif %}>Sign In</button>

      {% if error == 'incorrect_password' %}
      <div class="msg msg-error">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.4"/><path d="M5 5L9 9M9 5L5 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Incorrect password
      </div>
      {% endif %}

      {% if locked %}
      <div class="msg msg-lockout">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2.5" y="6" width="9" height="6.5" rx="1" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 6V4.5C4.5 3.12 5.62 2 7 2C8.38 2 9.5 3.12 9.5 4.5V6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Too many attempts. Please wait.
        <span class="countdown" id="countdown">{{ remaining }}s</span>
      </div>
      {% endif %}
    </form>
    <div class="help-text">
      Set your password via <span class="mono">VX_ADMIN_PASSWORD</span> in <span class="mono">.env</span>
    </div>
  </div>
</div>

<div class="footer">
  <div class="footer-left"><span class="health-dot"></span><span>Verdix</span></div>
  <div class="footer-right mono">v0.1.0-early-access</div>
</div>

{% if locked %}
<script>
  (function() {
    var remaining = {{ remaining }};
    var cd = document.getElementById('countdown');
    var interval = setInterval(function() {
      remaining--;
      if (remaining <= 0) { clearInterval(interval); location.reload(); return; }
      cd.textContent = remaining + 's';
    }, 1000);
  })();
</script>
{% endif %}
<script>
  function togglePassword() {
    var input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>
