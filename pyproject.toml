[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "verdix"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["eval", "src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Use src.infra.http.factory.create_http_client — direct httpx imports are forbidden outside src/infra/http/."

[tool.ruff.lint.per-file-ignores]
# Factory package owns httpx; test files use respx which requires httpx for building mock responses
"src/infra/http/*.py" = ["TID251"]
"**/test_*.py" = ["TID251"]
# Scripts are CLI helpers — relax line-length to keep print strings readable
"scripts/*.py" = ["E501"]
