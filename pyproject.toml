[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "verdix"
version = "0.1.7"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["eval", "src"]
asyncio_mode = "auto"
# A known intermittent deadlock in the async DB teardown path can hang the
# suite for 40+ minutes with zero output. thread-method dumps every thread's
# stack at the timeout point, so a hang becomes diagnosable instead of
# silent. Per-test, not per-suite — 30s is generous headroom over the
# ~20-30s the whole suite normally takes.
timeout = 30
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Use src.infra.http.factory.create_http_client — direct httpx imports are forbidden outside src/infra/http/."

[tool.ruff.lint.per-file-ignores]
# Factory package owns httpx; test files use respx which requires httpx for building mock responses
"src/infra/http/*.py" = ["TID251"]
"**/test_*.py" = ["TID251"]
# Scripts are CLI helpers — relax line-length to keep print strings readable
"scripts/*.py" = ["E501"]
