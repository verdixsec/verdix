#
# Local secret-scanning gate. Install once with:
#     pip install pre-commit && pre-commit install
# Runs gitleaks on staged changes before every commit so a credential can never
# land in a tracked file (a leaked Gemini key once rode an eval log to the mirror).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
